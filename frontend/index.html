<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NER9 · Savva Kashin, AI-First Senior Fullstack Engineer</title>
    <meta name="description" content="AI-First Senior Full-Stack Engineer with 7+ years of experience building web products end to end across LegalTech, iGaming, FinTech and developer platforms." />
    <meta name="author" content="Savva Kashin" />
    <!-- stores/theme.ts keeps this in step with the chosen theme; FL Studio is the default. -->
    <meta name="theme-color" content="#34424a" />

    <!-- Icons: tab, home screen (iOS / Android), installed app. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (LinkedIn, Telegram, Facebook, X…). Crawlers don't run JS, so every page
         shares this card; absolute URLs, the image is 1200×630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NER9" />
    <meta property="og:url" content="https://ner9.com/" />
    <meta property="og:title" content="Savva Kashin — AI-First Senior Fullstack Engineer" />
    <meta property="og:description" content="AI-First Senior Full-Stack Engineer with 7+ years of experience building web products end to end across LegalTech, iGaming, FinTech and developer platforms." />
    <meta property="og:image" content="https://ner9.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NER9.COM — Savva Kashin, AI-First Senior Fullstack Engineer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Savva Kashin — AI-First Senior Fullstack Engineer" />
    <meta name="twitter:description" content="AI-First Senior Full-Stack Engineer with 7+ years of experience building web products end to end across LegalTech, iGaming, FinTech and developer platforms." />
    <meta name="twitter:image" content="https://ner9.com/og-image.png" />
    <meta name="twitter:image:alt" content="NER9.COM — Savva Kashin, AI-First Senior Fullstack Engineer" />
    <script>
      // Apply the saved theme before the first paint (same logic as stores/theme.ts), so the
      // splash and the page never flash in the wrong colours.
      ;(function () {
        var themes = ['apple', 'fl', 'win98']
        var saved = null
        try {
          saved = localStorage.getItem('ner9-theme')
        } catch (e) {}
        if (themes.indexOf(saved) < 0) saved = 'fl'
        document.documentElement.dataset.theme = saved
      })()
    </script>
    <style>
      /* Splash shown until the app mounts (removed in main.ts): each theme boots like its
         original. FL Studio: its fruit pulsing on the beat. Apple: the white apple on black with
         a progress bar. Windows 98: the four-colour flag over the classic sliding blocks. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #000;
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      [data-theme='fl'] #splash {
        background: radial-gradient(circle at 50% 45%, #44545c 0%, #34424a 45%, #263136 100%);
      }
      #splash.splash--out {
        opacity: 0;
        visibility: hidden;
      }
      .splash__boot {
        display: none;
        flex-direction: column;
        align-items: center;
        transition: transform 0.45s ease;
      }
      [data-theme='fl'] .splash__boot--fl,
      [data-theme='apple'] .splash__boot--apple,
      [data-theme='win98'] .splash__boot--win {
        display: flex;
      }
      .splash--out .splash__boot {
        transform: scale(1.08);
      }

      /* FL Studio: 128 BPM, a kick on every beat. */
      .splash__fruit {
        width: clamp(96px, 26vw, 150px);
        transform-origin: 50% 65%;
        animation: splash-beat 0.469s cubic-bezier(0.2, 0.8, 0.3, 1) infinite;
      }
      @keyframes splash-beat {
        0% {
          transform: scale(1.12);
          filter: drop-shadow(0 0 30px rgba(255, 150, 40, 0.85));
        }
        55%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 12px rgba(255, 140, 26, 0.35));
        }
      }

      /* The site name under the logo, each in its theme's type. */
      .splash__name {
        margin: 0;
        opacity: 0;
        animation: splash-name 0.6s 0.15s ease-out forwards;
      }
      .splash__name--fl {
        margin-top: 22px;
        color: #e4ecef;
        font: 800 clamp(26px, 7.5vw, 38px) / 1 'Segoe UI', Tahoma, Arial, sans-serif;
        letter-spacing: 0.06em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      }
      .splash__name--fl span {
        color: #ff9a2e;
        font-weight: 300;
      }
      .splash__name--apple {
        margin-top: 26px;
        color: #f5f5f7;
        font: 200 clamp(26px, 7.5vw, 36px) / 1 'Helvetica Neue', Helvetica, Arial, sans-serif;
        letter-spacing: 0.04em;
      }
      @keyframes splash-name {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Apple: the boot screen, white apple and a thin progress bar. */
      .splash__apple {
        width: clamp(64px, 18vw, 96px);
        fill: #fff;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      .splash__progress {
        width: 150px;
        height: 4px;
        margin-top: 40px;
        overflow: hidden;
        border-radius: 2px;
        background: #3a3a3c;
      }
      .splash__progress::after {
        content: '';
        display: block;
        height: 100%;
        border-radius: inherit;
        background: #fff;
        animation: splash-fill 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes splash-breathe {
        50% {
          opacity: 0.75;
          transform: scale(0.97);
        }
      }
      @keyframes splash-fill {
        from {
          width: 4%;
        }
        to {
          width: 100%;
        }
      }

      /* Windows: the flag, the wordmark and three blue blocks sliding through a box. */
      .splash__flag {
        width: clamp(110px, 30vw, 170px);
      }
      .splash__wordmark {
        margin: 6px 0 0;
        color: #fff;
        font: 700 clamp(28px, 8vw, 44px) / 1 'Franklin Gothic Medium', Tahoma, Arial, sans-serif;
        letter-spacing: -0.02em;
      }
      .splash__wordmark sup {
        margin-left: 3px;
        color: #f35325;
        font-size: 0.55em;
        font-style: italic;
        font-weight: 400;
      }
      .splash__blocks {
        position: relative;
        width: 156px;
        height: 18px;
        margin-top: 48px;
        overflow: hidden;
        border: 2px solid #b2b2b2;
        border-radius: 5px;
      }
      .splash__blocks i {
        position: absolute;
        top: 2px;
        left: 0;
        width: 9px;
        height: 10px;
        border-radius: 1px;
        background: linear-gradient(180deg, #8ab0ff 0%, #2a5bd7 45%, #1c3fb4 100%);
        animation: splash-slide 2s linear infinite;
      }
      .splash__blocks i:nth-child(2) {
        animation-delay: 0.12s;
      }
      .splash__blocks i:nth-child(3) {
        animation-delay: 0.24s;
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-36px);
        }
        to {
          transform: translateX(170px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__fruit,
        .splash__apple,
        .splash__name,
        .splash__blocks i {
          animation: none;
        }
        .splash__name {
          opacity: 1;
        }
        .splash__progress::after {
          animation: none;
          width: 60%;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash__boot splash__boot--fl">
        <!-- FL Studio's own fruit, cut out of its app icon (Image-Line's artwork, like FL Chan). -->
        <img class="splash__fruit" src="/fl-fruit.webp" alt="" fetchpriority="high" />
        <p class="splash__name splash__name--fl">NER9<span>.COM</span></p>
      </div>
      <div class="splash__boot splash__boot--apple">
        <svg class="splash__apple" viewBox="0 0 24 24">
          <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" />
        </svg>
        <p class="splash__name splash__name--apple">ner9.com</p>
        <div class="splash__progress"></div>
      </div>
      <div class="splash__boot splash__boot--win">
        <svg class="splash__flag" viewBox="0 0 100 84">
          <path fill="#f35325" d="M14 10c11-6 21-6 33 0l-4 28c-12-6-22-6-33 0z" />
          <path fill="#81bc06" d="M51 12c12 6 22 6 34 0l-4 28c-12 6-22 6-34 0z" />
          <path fill="#05a6f0" d="M9 42c11-6 21-6 33 0l-4 28c-12-6-22-6-33 0z" />
          <path fill="#ffba08" d="M46 44c12 6 22 6 34 0l-4 28c-12 6-22 6-34 0z" />
          <path fill="#f35325" opacity="0.7" d="M5 14h5l-1 6H4zM0 22h4l-1 5H-1z" />
          <path fill="#05a6f0" opacity="0.7" d="M1 46h5l-1 6H0zM-3 54h4l-1 5h-4z" />
        </svg>
        <p class="splash__wordmark">NER9<sup>com</sup></p>
        <div class="splash__blocks"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
