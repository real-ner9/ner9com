<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NER9 · Savva Kashin, Senior Fullstack Engineer</title>
    <meta name="description" content="Fullstack engineer with 8 years building web products end to end: Node.js, NestJS, PHP (Laravel) and C# services on PostgreSQL, Redis and RabbitMQ, with React, Vue and TypeScript on the frontend." />
    <meta name="author" content="Savva Kashin" />
    <!-- stores/theme.ts keeps this in step with the chosen theme; FL Studio is the default. -->
    <meta name="theme-color" content="#34424a" />

    <!-- Icons: tab, home screen (iOS / Android), installed app. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (LinkedIn, Telegram, Facebook, X…). Crawlers don't run JS, so every page
         shares this card; absolute URLs, the image is 1200×630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NER9" />
    <meta property="og:url" content="https://ner9.com/" />
    <meta property="og:title" content="Savva Kashin — Senior Fullstack Engineer" />
    <meta property="og:description" content="Fullstack engineer with 8 years building web products end to end: Node.js, NestJS, PHP (Laravel) and C# services on PostgreSQL, Redis and RabbitMQ, with React, Vue and TypeScript on the frontend." />
    <meta property="og:image" content="https://ner9.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NER9.COM — Savva Kashin, Senior Fullstack Engineer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Savva Kashin — Senior Fullstack Engineer" />
    <meta name="twitter:description" content="Fullstack engineer with 8 years building web products end to end: Node.js, NestJS, PHP (Laravel) and C# services on PostgreSQL, Redis and RabbitMQ, with React, Vue and TypeScript on the frontend." />
    <meta name="twitter:image" content="https://ner9.com/og-image.png" />
    <meta name="twitter:image:alt" content="NER9.COM — Savva Kashin, Senior Fullstack Engineer" />
    <script>
      // Apply the saved theme before the first paint (same logic as stores/theme.ts), so the
      // splash and the page never flash in the wrong colours.
      ;(function () {
        var themes = ['apple', 'fl', 'win98']
        var saved = null
        try {
          saved = localStorage.getItem('ner9-theme')
        } catch (e) {}
        if (themes.indexOf(saved) < 0) saved = 'fl'
        document.documentElement.dataset.theme = saved
      })()
    </script>
    <style>
      /* Splash shown until the app mounts (removed in main.ts). Colours per theme mirror
         styles/theme.scss: page background and the hero gradient. */
      #splash {
        --s-bg: #c5ccd4;
        --s-1: #15181d;
        --s-2: #5d6676;
        --s-3: #2f6fd6;
        --s-font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--s-bg);
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      [data-theme='fl'] #splash {
        --s-bg: #34424a;
        --s-1: #ffb15c;
        --s-2: #ff8c1a;
        --s-3: #9ccc3d;
        --s-font: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }
      [data-theme='win98'] #splash {
        --s-bg: #008080;
        --s-1: #000080;
        --s-2: #1084d0;
        --s-3: #ffffff;
        --s-font: Tahoma, 'MS Sans Serif', Verdana, sans-serif;
      }
      #splash.splash--out {
        opacity: 0;
        visibility: hidden;
      }
      .splash__logo {
        display: flex;
        margin: 0;
        font-family: var(--s-font);
        font-size: clamp(40px, 11.5vw, 128px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        transition: transform 0.45s ease;
      }
      .splash--out .splash__logo {
        transform: scale(1.08);
      }
      /* Each letter rises in, then a band of the theme's colours sweeps through all of them. */
      .splash__logo span {
        padding: 0 0.02em;
        background: linear-gradient(
            100deg,
            var(--s-1) 0%,
            var(--s-2) 30%,
            var(--s-3) 50%,
            var(--s-2) 70%,
            var(--s-1) 100%
          )
          0 0 / 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 18px color-mix(in srgb, var(--s-3) 35%, transparent));
        opacity: 0;
        animation:
          splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
          splash-shine 2.4s linear infinite;
      }
      .splash__logo span:nth-child(2) {
        animation-delay: 0.07s, -0.15s;
      }
      .splash__logo span:nth-child(3) {
        animation-delay: 0.14s, -0.3s;
      }
      .splash__logo span:nth-child(4) {
        animation-delay: 0.21s, -0.45s;
      }
      .splash__logo span:nth-child(5) {
        animation-delay: 0.28s, -0.6s;
      }
      .splash__logo span:nth-child(6) {
        animation-delay: 0.35s, -0.75s;
      }
      .splash__logo span:nth-child(7) {
        animation-delay: 0.42s, -0.9s;
      }
      .splash__logo span:nth-child(8) {
        animation-delay: 0.49s, -1.05s;
      }
      .splash__bar {
        position: absolute;
        bottom: 22%;
        left: 50%;
        width: 120px;
        height: 3px;
        margin-left: -60px;
        overflow: hidden;
        border-radius: 3px;
        background: color-mix(in srgb, var(--s-2) 20%, transparent);
      }
      .splash__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--s-2), var(--s-3));
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(0.25em);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* One full gradient period (the image is 3x the letter: offset = -2w * -150% = 3w). */
      @keyframes splash-shine {
        to {
          background-position-x: -150%;
        }
      }
      @keyframes splash-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__logo span,
        .splash__bar::after {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <p class="splash__logo">
        <span>N</span><span>E</span><span>R</span><span>9</span><span>.</span><span>C</span><span>O</span><span>M</span>
      </p>
      <div class="splash__bar"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
