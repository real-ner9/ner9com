# Deploy via the VPS deploy gateway (/root/projects/deploy-gateway on the VPS).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ner9

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: backend
          - app: frontend
            context: frontend
    steps:
      # backend/music (1.4 GB) is bind-mounted on the VPS, never built into an
      # image: fetch only this app's directory, without the music blobs.
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /${{ matrix.context }}/
            !/backend/music/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ github.ref_name }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ github.ref_name }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      # The key only runs the gateway for this project; the GHCR token goes on stdin.
      - name: Release via deploy gateway
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            "root@$SSH_HOST" "deploy ${{ github.ref_name }} ${{ github.actor }}"
